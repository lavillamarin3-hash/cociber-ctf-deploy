# COCIBER_POSTGRESQL_16_MANAGED_V1
# Destino: postgresql@16-main.service.d/20-memory-guard.conf
# memory.high regula presión; memory.max puede provocar OOM dentro del servicio.
# Son límites del cgroup, NO garantías de ausencia de OOM ni RAM reservada.
[Service]
MemoryAccounting=yes
MemoryHigh=20G
MemoryMax=24G
MemorySwapMax=1G
