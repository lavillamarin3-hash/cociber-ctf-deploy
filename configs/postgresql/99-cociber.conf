# COCIBER_POSTGRESQL_16_MANAGED_V1
# lab-db-ctf: 4 vCPU, 32 GB RAM asignada, datos en disco dedicado.
# effective_cache_size NO reserva memoria ni limita el consumo a 20 GB.
listen_addresses = '10.10.10.14,localhost'
port = 5432
data_directory = '/mnt/db_data/postgres'
password_encryption = 'scram-sha-256'

# TLS de laboratorio; sustituir ambos archivos por un certificado con SAN
# IP:10.10.10.14 firmado por la CA que validará LAB-APP antes de producción.
ssl = on
ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'
ssl_min_protocol_version = 'TLSv1.2'

# Valores requeridos por la especificación.
shared_buffers = '8GB'
effective_cache_size = '20GB'
work_mem = '64MB'
maintenance_work_mem = '2GB'

# Contener concurrencia y memoria auxiliar en esta VM de 4 vCPU.
max_connections = 60
superuser_reserved_connections = 3
hash_mem_multiplier = 1.0
autovacuum_max_workers = 3
autovacuum_work_mem = '256MB'
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# WAL: tamaños de referencia, NO cuotas duras del disco.
min_wal_size = '2GB'
max_wal_size = '16GB'
checkpoint_completion_target = 0.9
idle_in_transaction_session_timeout = '5min'

# No se desactiva la durabilidad para ganar rendimiento.
fsync = on
full_page_writes = on
synchronous_commit = on
log_statement = 'none'
