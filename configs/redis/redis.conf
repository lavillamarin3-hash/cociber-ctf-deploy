# LAB-DB-POSTGRES: servicio nativo independiente de los paquetes de Redis 8.
bind 127.0.0.1 10.10.10.14
port 6379
protected-mode yes
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
timeout 0
tcp-keepalive 300
maxclients 1000

aclfile /etc/cociber-redis/users.acl
acl-pubsub-default resetchannels
enable-protected-configs no
enable-debug-command no
enable-module-command no

dir /mnt/db_data/redis
dbfilename dump.rdb
save 3600 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Límite del dataset administrado, NO un límite RSS de 8 GiB.
# Las sesiones/autenticación no deben desaparecer por una política de caché.
maxmemory 8gb
maxmemory-policy noeviction
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100
