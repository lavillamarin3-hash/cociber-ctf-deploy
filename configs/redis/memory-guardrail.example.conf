# EJEMPLO INACTIVO. No instalar sin medir PostgreSQL + Redis + kernel.
# Archivo final, si se aprueba: /etc/systemd/system/cociber-redis.service.d/memory.conf
# Un MemoryMax de 8G NO es equivalente a maxmemory 8gb y puede matar Redis.
# La carga de escritura durante fork/RDB/AOF puede requerir cerca del doble.
# Estos valores de ejemplo permiten 18G a Redis y solo dejan 14G para todo
# PostgreSQL + SO en una VM de 32G: NO son el presupuesto aprobado del host.
[Service]
# MemoryAccounting=yes
# MemoryHigh=12G
# MemoryMax=18G
